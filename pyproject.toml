[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apm-lite"
version = "0.1.0"
description = "Agent package manager for Claude Code and Antigravity on internal Git"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dynamic = ["dependencies"]  # read from requirements.txt

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.11",
]

[project.scripts]
apm = "apm_lite:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["apm_lite"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (Python modernisation)
    "B",    # bugbear (common bugs: mutable defaults, assert-false)
    "SIM",  # simplify (mechanical transformations)
    "RUF",  # ruff-specific patterns
    "S",    # bandit security checks
    "PLR",  # pylint refactor (complexity metrics)
    "C90",  # McCabe cyclomatic complexity
]
ignore = [
    "PLR2004",  # magic-value-comparison -- too noisy, especially in tests
    "E501",     # line-too-long -- ruff format handles code; remaining are strings/URLs
    "SIM117",   # multiple-with-statements -- style preference
    "S110",     # try-except-pass -- intentional graceful degradation in CLI error handling
    "S602",     # subprocess-popen-with-shell -- intentional in CLI wrapping git
    "SIM102",   # collapsible-if -- auto-fixable style improvement
]

[tool.ruff.lint.pylint]
max-statements = 200
max-args = 15
max-branches = 60
max-returns = 12

[tool.ruff.lint.mccabe]
max-complexity = 50

[tool.ruff.lint.isort]
known-first-party = ["apm_lite"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S103", "S105", "S106", "S108", "S110", "S112", "S603", "S607"]
"src/apm_lite.py" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
